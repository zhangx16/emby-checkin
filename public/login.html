<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 签到面板</title>
    <link rel="stylesheet" href="/login.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <p class="eyebrow">Access Gate</p>
        <h1>登录签到面板</h1>
        <p class="subtext">登录后才能管理多站点账号、查看状态并执行批量签到。</p>

        <form id="loginForm" class="login-form">
          <label class="field">
            <span>用户名</span>
            <input id="usernameField" name="username" type="text" autocomplete="username" required>
          </label>

          <label class="field">
            <span>密码</span>
            <input id="passwordField" name="password" type="password" autocomplete="current-password" required>
          </label>

          <button id="submitBtn" type="submit">登录</button>
          <div id="errorText" class="error-text"></div>
        </form>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
  </html>
