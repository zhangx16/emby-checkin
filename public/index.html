<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>签到项目</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell compact-shell">
      <header class="hero compact-hero">
        <div class="hero-copy">
          <p class="eyebrow">Check-in</p>
          <h1>签到项目</h1>
          <p class="hero-text">只展示已配置项目和最近结果，不在前端新增、删除或配置签到项。</p>
        </div>
        <aside class="hero-panel compact-panel">
          <div class="panel-label">最近刷新</div>
          <div id="lastActionText" class="last-action">等待加载</div>
          <div class="hero-actions">
            <button id="refreshViewBtn" class="primary-btn">刷新</button>
            <button id="logoutBtn" class="ghost-btn">退出</button>
          </div>
        </aside>
      </header>

      <section class="stats-grid">
        <article class="stat-card">
          <div class="stat-label">项目</div>
          <div id="statTotal" class="stat-value">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">正常</div>
          <div id="statHealthy" class="stat-value">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">异常</div>
          <div id="statAttention" class="stat-value">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">今日已签</div>
          <div id="statChecked" class="stat-value">0</div>
        </article>
      </section>

      <section class="toolbar compact-toolbar">
        <label class="search-shell">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="项目、域名、Bot">
        </label>
        <select id="providerFilter" class="filter-select">
          <option value="">全部类型</option>
          <option value="site">站点</option>
          <option value="telegram">Telegram Bot</option>
          <option value="glados">GLaDOS</option>
          <option value="embypulse">EmbyPulse</option>
          <option value="embymb">EmbyMB</option>
          <option value="zhousanwan">周三晚</option>
          <option value="dian115">癫影</option>
        </select>
        <select id="statusFilter" class="filter-select">
          <option value="">全部状态</option>
          <option value="active">正常</option>
          <option value="unchecked">未查询</option>
          <option value="error">异常</option>
        </select>
      </section>

      <section class="project-board">
        <div class="board-head simple-head">
          <div>
            <div class="board-title">项目列表</div>
            <div id="visibleText" class="muted-text">显示 0 项</div>
          </div>
        </div>
        <div id="projectGrid" class="project-grid"></div>
      </section>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
